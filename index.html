<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Analysis Dashboard</title>
<script src="data.js"></script>
<style>
  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #16161f; --border: #1e1e2e;
    --accent: #4f8ef7; --accent2: #7c6af7; --green: #22c55e; --red: #ef4444;
    --yellow: #f59e0b; --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.5; padding: 24px; min-height: 100vh; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .header-left h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); }
  .header-left .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .timestamp { font-size: 11px; color: var(--muted); text-align: right; }
  .status-pill { display: inline-flex; align-items: center; gap: 5px; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; margin-top: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .grid { display: grid; gap: 16px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2-1 { grid-template-columns: 2fr 1fr; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card-sm { padding: 14px 16px; }
  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 14px; }
  .stat-value { font-size: 24px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-change { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; margin-top: 6px; }
  .up { color: var(--green); } .down { color: var(--red); } .neutral { color: var(--yellow); }
  .signal { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .signal-bull { background: rgba(34,197,94,0.12); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
  .signal-bear { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
  .signal-warn { background: rgba(245,158,11,0.12); color: var(--yellow); border: 1px solid rgba(245,158,11,0.2); }
  .signal-neut { background: rgba(100,116,139,0.12); color: var(--dim); border: 1px solid rgba(100,116,139,0.2); }
  .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tf-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .tf-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px; }
  .tf-price { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
  .tf-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .tf-key { color: var(--muted); } .tf-val { font-weight: 500; }
  .rsi-bar-wrap { margin-top: 8px; }
  .rsi-track { height: 4px; background: var(--border); border-radius: 2px; position: relative; margin-top: 4px; }
  .rsi-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .rsi-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
  .idx-table { width: 100%; border-collapse: collapse; }
  .idx-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .idx-table td { padding: 7px 8px; font-size: 12px; border-bottom: 1px solid rgba(30,30,46,0.5); }
  .idx-table tr:last-child td { border-bottom: none; }
  .idx-table .name { color: var(--dim); font-weight: 500; } .idx-table .price { font-weight: 600; font-variant-numeric: tabular-nums; } .idx-table .chg { font-weight: 600; font-variant-numeric: tabular-nums; }
  .sector-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(30,30,46,0.5); }
  .sector-row:last-child { border-bottom: none; }
  .sector-name { width: 130px; font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .sector-val { width: 40px; text-align: right; font-size: 11px; font-weight: 600; }
  .level-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(30,30,46,0.5); font-size: 12px; }
  .level-row:last-child { border-bottom: none; }
  .level-label { color: var(--muted); font-size: 11px; } .level-val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .bias-block { background: var(--surface2); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .bias-title { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .bias-text { font-size: 13px; line-height: 1.6; color: var(--dim); }
  .heat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 4px; }
  .heat-cell { border-radius: 6px; padding: 8px 6px; text-align: center; font-size: 10px; font-weight: 700; }
  .heat-cell .ticker { font-size: 11px; font-weight: 700; } .heat-cell .pct { font-size: 10px; margin-top: 1px; }
  .alert-bar { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--yellow); margin-bottom: 16px; }
  .alert-icon { font-size: 14px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .bullets { list-style: none; }
  .bullets li { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; color: var(--dim); border-bottom: 1px solid rgba(30,30,46,0.5); line-height: 1.5; }
  .bullets li:last-child { border-bottom: none; }
  .bullets li::before { content: "→"; color: var(--accent); flex-shrink: 0; }
  .corr-table { width: 100%; border-collapse: collapse; }
  .corr-table td { padding: 5px 8px; font-size: 11px; border-bottom: 1px solid rgba(30,30,46,0.4); }
  .corr-table tr:last-child td { border-bottom: none; }
  .corr-pair { color: var(--muted); } .corr-val { font-weight: 700; color: var(--accent); text-align: right; }
  .vol-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; border-bottom: 1px solid rgba(30,30,46,0.5); }
  .vol-row:last-child { border-bottom: none; }
  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
    .tf-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function() {
  const D = MARKET_DATA;
  function h(tag, attrs) {
    const el = document.createElement(tag);
    const children = Array.prototype.slice.call(arguments, 2);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'cls') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v);
    }
    children.forEach(function(c) {
      if (c == null) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function div(cls) { var args = [{cls:cls}].concat(Array.prototype.slice.call(arguments,1)); return h.apply(null, ['div'].concat(args)); }
  function span(cls, text) { var s = document.createElement('span'); s.className = cls; s.textContent = text; return s; }
  function spanH(cls, html) { var s = document.createElement('span'); s.className = cls; s.innerHTML = html; return s; }

  function renderHeader() {
    var m = D.meta;
    return h('div', {cls:'header'},
      h('div', {cls:'header-left'},
        h('h1', {}, 'Market Analysis Dashboard'),
        h('div', {cls:'sub'}, m.symbol + ' · Equities · Macro · ' + m.date),
        h('div', {cls:'status-pill'}, h('span',{cls:'dot'}), ' Live Analysis')
      ),
      h('div', {cls:'timestamp', html:'Generated: '+m.generated+'<br>Instrument: '+m.instrument+'<br>Session: '+m.session})
    );
  }

  function renderAlert() {
    if (!D.alert.show) return null;
    return h('div', {cls:'alert-bar'}, span('alert-icon','⚠'), spanH('', D.alert.text));
  }

  function renderStats() {
    var s = D.stats;
    var breadthRows = s.breadth.map(function(b) {
      return h('div', {style:'display:flex;justify-content:space-between;font-size:12px;'},
        h('span',{style:'color:var(--dim);'}, b.ticker),
        h('span',{cls:b.cls,style:'font-weight:700;'}, b.pct)
      );
    });
    return h('div', {cls:'grid grid-4',style:'margin-bottom:16px;'},
      h('div',{cls:'card card-sm'}, div('card-title','NQ Futures'), h('div',{cls:'stat-value'},s.price.value), h('div',{cls:'stat-label'},s.price.label), h('div',{cls:'stat-change '+s.price.changeClass},s.price.change)),
      h('div',{cls:'card card-sm'}, div('card-title','Market Bias'),
        h('div',{style:'margin-top:4px;'},
          h('div',{cls:'signal '+s.bias.signalClass,style:'margin-bottom:8px;'},s.bias.dot+' '+s.bias.signal),
          h('div',{style:'font-size:11px;color:var(--muted);line-height:1.5;'},s.bias.description)
        )
      ),
      h('div',{cls:'card card-sm'}, div('card-title','Volatility'), h('div',{cls:'stat-value '+s.volatility.valueClass},s.volatility.value), h('div',{cls:'stat-label'},s.volatility.label), h('div',{cls:'stat-change '+s.volatility.changeClass},s.volatility.change)),
      h('div',{cls:'card card-sm'}, div('card-title','Breadth'),
        h('div',{style:'margin-top:2px;'},
          h('div',{style:'font-size:11px;color:var(--muted);margin-bottom:6px;'},'Index Performance (Today)'),
          h.apply(null, ['div',{style:'display:flex;flex-direction:column;gap:4px;'}].concat(breadthRows))
        )
      )
    );
  }

  function renderTFCard(tf) {
    var rows = tf.rows.map(function(r) {
      return h('div',{cls:'tf-row'}, span('tf-key',r.key), h('span',{cls:'tf-val '+r.cls},r.val));
    });
    return h.apply(null, ['div',{cls:'tf-card'},
      div('tf-label',tf.label),
      h('div',{cls:'tf-price'},tf.price),
      h('div',{style:'margin:8px 0 10px;'}, h('span',{cls:'signal '+tf.signalClass},tf.signal))
    ].concat(rows).concat([
      h('div',{cls:'rsi-bar-wrap'},
        h('div',{style:'display:flex;justify-content:space-between;font-size:10px;color:var(--muted);'},
          h('span',{},'RSI(14)'), h('span',{cls:tf.rsi.cls},tf.rsi.label)
        ),
        h('div',{cls:'rsi-track'}, h('div',{cls:'rsi-fill',style:'width:'+tf.rsi.value+'%;background:'+tf.rsi.gradient+';'})),
        h('div',{cls:'rsi-label'}, h('span',{},'0'), h('span',{},'30'), h('span',{},'50'), h('span',{},'70'), h('span',{},'100'))
      ),
      h('div',{style:'margin-top:8px;font-size:10px;color:'+(tf.note.cls==='down'?'var(--red)':'var(--muted)')+';line-height:1.5;'},tf.note.text)
    ]));
  }

  function renderTimeframes() {
    return h.apply(null, ['div',{cls:'card',style:'margin-bottom:16px;'},
      div('card-title','ENQH26 · Multi-Timeframe Analysis'),
      h.apply(null, ['div',{cls:'tf-grid'}].concat(D.timeframes.map(renderTFCard)))
    ]);
  }

  function renderKeyLevels() {
    return h.apply(null, ['div',{cls:'card'},
      div('card-title','Key Price Levels · '+D.meta.symbol)
    ].concat(D.keyLevels.map(function(l) {
      return h('div',{cls:'level-row'}, span('level-label',l.label), h('span',{cls:'level-val '+l.cls},l.val));
    })));
  }

  function renderIndices() {
    var yieldCols = D.yields.map(function(y) {
      return h('div',{style:'text-align:center;'},
        h('div',{style:'font-size:11px;color:var(--muted);'},y.tenor),
        h('div',{style:'font-weight:700;font-size:13px;'},y.val),
        h('div',{style:'font-size:10px;color:var(--, '+(y.cls==='up'?'var(--green)':'var(--red)')+');'},y.chg)
      );
    });
    // fix yield color
    yieldCols = D.yields.map(function(y) {
      var el = h('div',{style:'text-align:center;'},
        h('div',{style:'font-size:11px;color:var(--muted);'},y.tenor),
        h('div',{style:'font-weight:700;font-size:13px;'},y.val)
      );
      var chg = document.createElement('div');
      chg.style.fontSize = '10px';
      chg.style.color = y.cls === 'up' ? '#22c55e' : '#ef4444';
      chg.textContent = y.chg;
      el.appendChild(chg);
      return el;
    });
    return h('div',{cls:'card'},
      div('card-title','US Index Performance'),
      h('table',{cls:'idx-table'},
        h('thead',{}, h('tr',{}, h('th',{},'Index'), h('th',{},'Price'), h('th',{},'Chg'))),
        h.apply(null, ['tbody',{}].concat(D.indices.map(function(idx) {
          return h('tr',{}, h('td',{cls:'name'},idx.name), h('td',{cls:'price'},idx.price), h('td',{cls:'chg '+idx.cls},idx.chg));
        })))
      ),
      h('hr',{cls:'divider',style:'margin:10px 0;'}),
      h('div',{cls:'card-title',style:'margin-bottom:8px;'},'Bond Yields'),
      h.apply(null, ['div',{style:'display:grid;grid-template-columns:repeat(3,1fr);gap:6px;'}].concat(yieldCols))
    );
  }

  function renderVolGlobal() {
    return h.apply(null, ['div',{cls:'card'},
      div('card-title','Volatility & Global Markets')
    ].concat(D.volatility.map(function(v) {
      return h('div',{cls:'vol-row'},
        h('span',{style:'color:var(--muted);'},v.label),
        h('span',{}, h('span',{style:'font-weight:700;'},v.val), h('span',{cls:v.chgCls,style:'font-size:11px;margin-left:4px;'},v.chg))
      );
    })).concat([
      h('hr',{cls:'divider',style:'margin:8px 0;'}),
      h('div',{cls:'card-title',style:'margin-bottom:8px;'},'Global Indices')
    ]).concat(D.globalIndices.map(function(g) {
      return h('div',{cls:'vol-row'}, h('span',{style:'color:var(--muted);'},g.name), h('span',{cls:g.cls,style:'font-weight:600;'},g.chg));
    })));
  }

  function renderSectors() {
    return h.apply(null, ['div',{cls:'card'},
      div('card-title','Sector Performance · S&P 500')
    ].concat(D.sectors.map(function(s) {
      return h('div',{cls:'sector-row'},
        span('sector-name',s.name),
        h('div',{cls:'bar-wrap'}, h('div',{cls:'bar-fill',style:'width:'+s.barWidth+'%;background:'+s.barColor+';'+(s.barOpacity?'opacity:'+s.barOpacity+';':'')})),
        h('span',{cls:'sector-val '+s.cls},s.val)
      );
    })).concat([
      h('hr',{cls:'divider',style:'margin:12px 0 10px;'}),
      h('div',{cls:'card-title',style:'margin-bottom:8px;'},'Notable Movers'),
      h.apply(null, ['div',{cls:'heat-grid'}].concat(D.movers.map(function(m) {
        return h('div',{cls:'heat-cell',style:'background:'+m.bg+';border:1px solid '+m.border+';'},
          h('div',{cls:'ticker '+m.cls},m.ticker), h('div',{cls:'pct '+m.cls},m.pct)
        );
      })))
    ]));
  }

  function renderCorr() {
    return h.apply(null, ['div',{cls:'card'},
      div('card-title','Index Correlations'),
      h.apply(null, ['table',{cls:'corr-table'}].concat(D.correlations.map(function(c) {
        return h('tr',{}, h('td',{cls:'corr-pair'},c.pair), h('td',{cls:'corr-val'},c.val));
      })))
    ].concat([h('div',{style:'margin-top:8px;font-size:10px;color:var(--muted);'},D.correlationsNote)]));
  }

  function renderCommodities() {
    return h.apply(null, ['div',{cls:'card'}, div('card-title','Commodities & FX')].concat(
      D.commodities.map(function(c) {
        return h('div',{cls:'vol-row'}, h('span',{style:'color:var(--muted);'},c.label),
          h('span',{}, h('span',{style:'font-weight:700;'},c.val), h('span',{cls:c.chgCls,style:'font-size:11px;margin-left:4px;'},c.chg))
        );
      })
    ));
  }

  function renderCrypto() {
    return h.apply(null, ['div',{cls:'card'}, div('card-title','Crypto')].concat(
      D.crypto.map(function(c) {
        return h('div',{cls:'vol-row'}, h('span',{style:'color:var(--muted);'},c.label),
          h('span',{}, h('span',{style:'font-weight:700;'},c.val), h('span',{cls:c.chgCls,style:'font-size:11px;margin-left:4px;'},c.chg))
        );
      })
    ));
  }

  function renderCOT() {
    var cot = D.cot;
    var groupCards = cot.groups.map(function(g) {
      return h('div',{style:'background:var(--surface2);border-radius:8px;padding:14px;'},
        h('div',{style:'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);margin-bottom:8px;'},g.label),
        h('div',{style:'display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);'},
          h('span',{style:'color:var(--muted);'},'Long'),
          h('span',{style:'font-weight:600;'},g.long.val+' ', h('span',{cls:g.long.chgCls,style:'font-size:10px;'},g.long.chg))
        ),
        h('div',{style:'display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);'},
          h('span',{style:'color:var(--muted);'},'Short'),
          h('span',{style:'font-weight:600;'},g.short.val+' ', h('span',{cls:g.short.chgCls,style:'font-size:10px;'},g.short.chg))
        ),
        h('div',{style:'display:flex;justify-content:space-between;font-size:12px;padding:6px 0;'},
          h('span',{style:'color:var(--muted);'},'Net Position'),
          h('span',{cls:g.net.cls,style:'font-weight:700;'},g.net.val)
        ),
        h('div',{cls:'signal '+g.signalClass,style:'margin-top:4px;font-size:10px;'},g.signal)
      );
    });
    return h.apply(null, ['div',{cls:'card',style:'margin-bottom:16px;'},
      div('card-title',cot.title),
      h.apply(null, ['div',{cls:'grid grid-3',style:'gap:12px;margin-bottom:12px;'}].concat(groupCards)),
      h('div',{style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap;'},
        h('div',{style:'background:var(--surface2);border-radius:8px;padding:10px 16px;font-size:12px;'},
          h('span',{style:'color:var(--muted);'},'Open Interest: '),
          h('span',{style:'font-weight:700;'},cot.openInterest.val+' '),
          h('span',{cls:cot.openInterest.chgCls,style:'font-size:11px;'},cot.openInterest.chg)
        ),
        h('div',{style:'flex:1;font-size:11px;color:var(--muted);line-height:1.6;'},cot.note)
      )
    ]);
  }

  function renderThesis() {
    var t = D.thesis;
    function biasBlock(b) {
      return h('div',{cls:'bias-block'}, h('div',{cls:'bias-title'},b.title), h('div',{cls:'bias-text'},b.text));
    }
    return h.apply(null, ['div',{cls:'card'},
      div('card-title','Trade Thesis & Analytical Summary'),
      h('div',{cls:'grid grid-3',style:'gap:12px;'},
        h('div',{},biasBlock(t.bull)), h('div',{},biasBlock(t.bear)), h('div',{},biasBlock(t.scenarios))
      ),
      h('hr',{cls:'divider',style:'margin:14px 0;'}),
      h('div',{cls:'card-title',style:'margin-bottom:10px;'},'Actionable Observations'),
      h.apply(null, ['ul',{cls:'bullets'}].concat(t.bullets.map(function(b){ return h('li',{},b); })))
    ]);
  }

  function render() {
    var app = document.getElementById('app');
    app.appendChild(renderHeader());
    var a = renderAlert(); if (a) app.appendChild(a);
    app.appendChild(renderStats());
    app.appendChild(renderTimeframes());
    app.appendChild(h('div',{cls:'grid grid-3',style:'margin-bottom:16px;'},
      renderKeyLevels(), renderIndices(), renderVolGlobal()
    ));
    app.appendChild(h('div',{cls:'grid grid-2-1',style:'margin-bottom:16px;'},
      renderSectors(),
      h('div',{style:'display:flex;flex-direction:column;gap:16px;'},
        renderCorr(), renderCommodities(), renderCrypto()
      )
    ));
    app.appendChild(renderCOT());
    app.appendChild(renderThesis());
    app.appendChild(h('div',{style:'margin-top:16px;text-align:center;font-size:10px;color:var(--muted);'},
      'Market Analysis Dashboard · '+D.meta.symbol+' · '+D.meta.date+' · Data sourced from live session screenshots · For informational purposes only'
    ));
  }

  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
