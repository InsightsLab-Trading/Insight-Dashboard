<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060b12;--c1:#0b1220;--c2:#101828;--c3:#162033;
  --b1:#1a2540;--b2:#243050;
  --t1:#dde4f0;--t2:#8898aa;--t3:#506070;
  --acc:#06b6d4;
  --bull:#10b981;--bull2:rgba(16,185,129,.12);--bull3:rgba(16,185,129,.25);
  --bear:#ef4444;--bear2:rgba(239,68,68,.12);--bear3:rgba(239,68,68,.25);
  --warn:#f59e0b;--warn2:rgba(245,158,11,.12);
  --r:6px;--g:10px
}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;font-size:12.5px;line-height:1.5;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}

/* loader */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px;transition:opacity .4s}
#loader.hidden{opacity:0;pointer-events:none}
.ld-ring{width:36px;height:36px;border:2px solid var(--b1);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
.ld-text{color:var(--t3);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(6,11,18,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--b1)}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.25em;text-transform:uppercase}
.hdiv{width:1px;height:16px;background:var(--b1)}
.inst{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--t1)}
.contract{background:var(--c2);border:1px solid var(--b1);padding:2px 8px;border-radius:3px;font-size:10px;color:var(--t3)}
.sess-badge{padding:3px 9px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.05em}
.sb-open{background:var(--bull2);color:var(--bull);border:1px solid rgba(16,185,129,.3)}
.sb-ph{background:rgba(6,182,212,.12);color:var(--acc);border:1px solid rgba(6,182,212,.3)}
.sb-dz{background:var(--warn2);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.sb-pre{background:var(--c2);color:var(--t2);border:1px solid var(--b1)}
.sb-ah{background:var(--c2);color:var(--t3);border:1px solid var(--b1)}
.hspacer{flex:1}
.price-tag{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--t1)}
.ts{font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}
.refresh-btn{background:var(--c2);border:1px solid var(--b1);color:var(--t3);padding:4px 10px;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;transition:.15s}
.refresh-btn:hover{color:var(--acc);border-color:var(--acc)}

/* decision banner */
.decision-bar{padding:10px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--b1)}
.dec-pill{padding:7px 28px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;flex-shrink:0}
.d-execute{background:var(--bull2);color:var(--bull);border:1px solid var(--bull);animation:glow 2.5s ease-in-out infinite}
.d-wait{background:var(--warn2);color:var(--warn);border:1px solid var(--warn)}
.d-skip{background:var(--bear2);color:var(--bear);border:1px solid var(--bear)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.3)}50%{box-shadow:0 0 12px 3px rgba(16,185,129,.15)}}
.dec-score{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.dec-score-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;line-height:1}
.dec-score-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin-top:2px}
.dec-narrative{flex:1;font-size:12px;color:var(--t2);line-height:1.6;border-left:2px solid var(--b1);padding-left:14px}
.dec-narrative strong{color:var(--t1)}
.risk-flags{display:flex;gap:6px;flex-shrink:0}
.rflag{padding:3px 9px;border-radius:3px;font-size:10px;font-weight:600}
.rf-warn{background:var(--warn2);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.rf-stop{background:var(--bear2);color:var(--bear);border:1px solid rgba(239,68,68,.3)}
.rf-ok{background:var(--bull2);color:var(--bull);border:1px solid rgba(16,185,129,.3)}

/* main grid */
.main{display:grid;grid-template-columns:1fr 340px;gap:var(--g);padding:var(--g);max-width:1800px;margin:0 auto}
@media(max-width:1100px){.main{grid-template-columns:1fr}}
.col-l{display:flex;flex-direction:column;gap:var(--g)}
.col-r{display:flex;flex-direction:column;gap:var(--g)}

/* card */
.card{background:var(--c1);border:1px solid var(--b1);border-radius:var(--r);padding:12px}
.card-title{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ct-dot{width:5px;height:5px;border-radius:50%;background:var(--acc)}

/* regime */
.regime-card{border-radius:var(--r);padding:12px;border-left:3px solid var(--b1);border-top:1px solid var(--b1);border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);position:relative}
.rc-bull{background:linear-gradient(135deg,var(--c1),rgba(10,30,20,.8));border-left-color:var(--bull)}
.rc-bear{background:linear-gradient(135deg,var(--c1),rgba(30,10,10,.8));border-left-color:var(--bear)}
.rc-ob{background:linear-gradient(135deg,var(--c1),rgba(30,20,5,.8));border-left-color:var(--warn)}
.rc-os{background:linear-gradient(135deg,var(--c1),rgba(20,10,30,.8));border-left-color:#a78bfa}
.rc-chop{border-left-color:var(--t3)}
.rc-vol{background:linear-gradient(135deg,var(--c1),rgba(30,15,5,.8));border-left-color:#fb923c}
.regime-name{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.conf-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.conf-bar-bg{flex:1;height:5px;background:var(--b1);border-radius:3px;overflow:hidden}
.conf-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.conf-num{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;white-space:nowrap}
.regime-reason{font-size:11.5px;color:var(--t2);line-height:1.6}

/* ema table */
.ema-tbl{width:100%;border-collapse:collapse}
.ema-tbl th{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--t3);padding:4px 8px;text-align:left;border-bottom:1px solid var(--b1)}
.ema-tbl td{padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.03)}
.ema-tbl tr:last-child td{border-bottom:none}
.ema-tbl .row-bull{background:rgba(16,185,129,.03)}
.ema-tbl .row-bear{background:rgba(239,68,68,.03)}
.bias-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9.5px;font-weight:600;font-family:'Inter',sans-serif}
.bt-bull{background:var(--bull2);color:var(--bull)}
.bt-bear{background:var(--bear2);color:var(--bear)}
.bt-neutral{background:rgba(100,116,139,.12);color:var(--t3)}

/* rsi */
.rsi-row{display:flex;gap:8px;margin-top:8px}
.rsi-block{flex:1;background:var(--c2);border:1px solid var(--b1);border-radius:5px;padding:8px;text-align:center}
.rsi-tf-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin-bottom:3px}
.rsi-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;line-height:1}
.rsi-zone-label{font-size:9px;color:var(--t3);margin-top:2px}
.rsi-flag-label{font-size:9.5px;font-weight:600;color:var(--warn);margin-top:3px;padding:2px 6px;background:var(--warn2);border-radius:3px;display:inline-block}

/* vol */
.vol-row{display:flex;gap:8px;margin-top:8px}
.vol-chip{flex:1;background:var(--c2);border:1px solid var(--b1);border-radius:5px;padding:7px 8px}
.vc-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:2px}
.vc-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
.vc-state{font-size:9.5px;font-weight:600;margin-top:2px}
.vs-tight{color:var(--bull)}.vs-normal{color:var(--t2)}.vs-elevated{color:var(--warn)}.vs-extreme{color:var(--bear)}

/* vwap / vol profile */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vp-level{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11.5px}
.vp-level:last-child{border-bottom:none}
.vp-label{color:var(--t3);font-size:10px}
.vp-price{font-family:'JetBrains Mono',monospace;font-weight:600}
.in-range{color:var(--acc)}.above-vah{color:var(--bull)}.below-val{color:var(--bear)}

/* levels */
.levels-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lev-row{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--c2);border:1px solid var(--b1);border-radius:4px}
.lev-label{font-size:9.5px;color:var(--t3)}
.lev-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.lev-sasuke{border-color:rgba(6,182,212,.25);background:rgba(6,182,212,.04)}

/* opportunities */
.opp-card{background:var(--c2);border:1px solid var(--b1);border-radius:var(--r);padding:12px;border-left:3px solid var(--b1)}
.opp-card.long{border-left-color:var(--bull)}
.opp-card.short{border-left-color:var(--bear)}
.opp-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dir-pill{padding:3px 10px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em}
.dp-long{background:var(--bull2);color:var(--bull);border:1px solid rgba(16,185,129,.3)}
.dp-short{background:var(--bear2);color:var(--bear);border:1px solid rgba(239,68,68,.3)}
.conv-badge{padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600}
.cb-high{background:var(--bull2);color:var(--bull)}.cb-med{background:var(--warn2);color:var(--warn)}.cb-low{background:rgba(100,116,139,.12);color:var(--t3)}
.opp-trigger{font-size:11.5px;color:var(--t1);line-height:1.5;margin-bottom:10px;padding:8px;background:var(--c1);border-radius:4px;border:1px solid var(--b1)}
.levels-strip{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ls-item{flex:1;min-width:60px;text-align:center;padding:6px;background:var(--c1);border:1px solid var(--b1);border-radius:4px}
.ls-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:2px}
.ls-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.ls-entry .ls-val{color:var(--acc)}
.ls-stop .ls-val{color:var(--bear)}
.ls-t1 .ls-val{color:var(--bull)}
.ls-t2 .ls-val{color:rgba(16,185,129,.7)}
.ls-rr .ls-val{color:var(--t1)}
.conf-checks{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.cc-item{display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;font-size:10px}
.cc-pass{background:var(--bull2);color:var(--bull)}.cc-fail{background:rgba(100,116,139,.08);color:var(--t3)}
.opp-notes{font-size:11px;color:var(--t2);line-height:1.5;padding-top:8px;border-top:1px solid var(--b1)}

/* scenarios */
.scen-grid{display:grid;gap:6px}
.scen{border-radius:5px;padding:10px;border:1px solid transparent}
.scen-bull{background:rgba(16,185,129,.05);border-color:rgba(16,185,129,.15)}
.scen-bear{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.15)}
.scen-chop{background:rgba(100,116,139,.05);border-color:rgba(100,116,139,.1)}
.scen-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.scen-name{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.sn-bull{color:var(--bull)}.sn-bear{color:var(--bear)}.sn-chop{color:var(--t3)}
.scen-pct{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700}
.sp-bull{color:var(--bull)}.sp-bear{color:var(--bear)}.sp-chop{color:var(--t3)}
.scen-bar{height:3px;border-radius:2px;margin-bottom:7px}
.sb-bull{background:var(--bull)}.sb-bear{background:var(--bear)}.sb-chop{background:var(--t3)}
.scen-line{display:flex;gap:6px;font-size:11px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.scen-line:last-child{border-bottom:none}
.sl-key{color:var(--t3);white-space:nowrap;min-width:62px}
.sl-val{color:var(--t2);flex:1}
.inv-block{margin-top:8px;padding:8px;background:var(--bear2);border:1px solid rgba(239,68,68,.2);border-radius:4px;font-size:11px;color:var(--bear);line-height:1.5}
.inv-block strong{color:var(--bear)}

/* big trades */
.bt-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.bt-item:last-child{border-bottom:none}
.btdot{width:18px;height:18px;border-radius:50%;flex-shrink:0;border:2px solid}
.btdot.buy{background:rgba(16,185,129,.2);border-color:var(--bull)}
.btdot.sell{background:rgba(239,68,68,.2);border-color:var(--bear)}
.bt-price{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;min-width:52px}
.bt-note{flex:1;font-size:11px;color:var(--t2)}
.bt-size{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);white-space:nowrap}

/* scoring */
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.score-item{background:var(--c2);border:1px solid var(--b1);border-radius:4px;padding:7px 9px}
.si-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin-bottom:4px}
.si-bar-bg{height:4px;background:var(--b1);border-radius:2px;overflow:hidden;margin-bottom:4px}
.si-bar-fill{height:100%;border-radius:2px;background:var(--acc);transition:width .4s}
.si-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}

/* chart */
.chart-wrap{background:var(--c1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.chart-wrap img{width:100%;display:block}
.chart-placeholder{padding:40px;text-align:center;color:var(--t3);font-size:11px}

/* risk strip */
.risk-strip{display:flex;gap:6px;flex-wrap:wrap}
.rk-chip{flex:1;min-width:90px;background:var(--c2);border:1px solid var(--b1);border-radius:4px;padding:7px 9px;text-align:center}
.rk-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:3px}
.rk-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700}
.rk-full{color:var(--bull)}.rk-half{color:var(--warn)}.rk-skip{color:var(--bear)}

/* utility */
.null-text{color:var(--t3);font-size:11px;font-style:italic}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9.5px;font-weight:600}
</style>
</head>
<body>

<div id="loader"><div class="ld-ring"></div><div class="ld-text">Loading analysis</div></div>

<header>
  <div class="hdr" id="hdr">
    <span class="brand">Insight 2.0</span>
    <div class="hdiv"></div>
    <span class="inst mono" id="hInst">—</span>
    <span class="contract" id="hContract">—</span>
    <span class="sess-badge sb-pre" id="hSess">—</span>
    <div class="hdiv"></div>
    <span class="price-tag mono" id="hPrice">—</span>
    <div class="hspacer"></div>
    <span class="ts" id="hTime">—</span>
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
  <div class="decision-bar" id="decBar">
    <div class="dec-pill d-wait" id="decPill">WAIT</div>
    <div class="dec-score">
      <div class="dec-score-num mono" id="decScore">—</div>
      <div class="dec-score-label">Overall</div>
    </div>
    <div class="dec-narrative" id="decNarrative"><span class="null-text">Loading...</span></div>
    <div class="risk-flags" id="riskFlags"></div>
  </div>
</header>

<div class="main">
  <div class="col-l">

    <!-- chart -->
    <div class="chart-wrap" id="chartWrap">
      <div class="chart-placeholder">No chart loaded</div>
    </div>

    <!-- opportunities -->
    <div id="oppsContainer">
      <div class="card">
        <div class="card-title"><div class="ct-dot"></div>Trade Opportunities</div>
        <div class="null-text">No opportunities loaded</div>
      </div>
    </div>

    <!-- scenarios -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>Scenarios</div>
      <div class="scen-grid" id="scenGrid">
        <div class="null-text">Loading...</div>
      </div>
      <div id="invBlock"></div>
    </div>

  </div>
  <div class="col-r">

    <!-- regime -->
    <div class="regime-card rc-chop" id="regimeCard">
      <div class="card-title" style="margin-bottom:8px"><div class="ct-dot"></div>Regime</div>
      <div class="regime-name" id="regimeName">—</div>
      <div class="conf-row">
        <div class="conf-bar-bg"><div class="conf-bar-fill" id="confBar" style="width:0;background:var(--acc)"></div></div>
        <div class="conf-num" id="confNum">—</div>
      </div>
      <div class="regime-reason" id="regimeReason">—</div>
    </div>

    <!-- ema + rsi + vol -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>EMA Stack</div>
      <table class="ema-tbl">
        <thead><tr><th>TF</th><th>EMA9</th><th>EMA21</th><th>Bias</th></tr></thead>
        <tbody id="emaTbody"></tbody>
      </table>

      <div style="margin-top:12px">
        <div class="card-title" style="margin-bottom:0"><div class="ct-dot"></div>RSI (14)</div>
        <div class="rsi-row" id="rsiRow"></div>
      </div>

      <div style="margin-top:12px">
        <div class="card-title" style="margin-bottom:0"><div class="ct-dot"></div>Volatility</div>
        <div class="vol-row" id="volRow"></div>
      </div>
    </div>

    <!-- vwap + vol profile -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>VWAP &amp; Volume Profile</div>
      <div class="two-col">
        <div id="vwapCol"></div>
        <div id="vpCol"></div>
      </div>
    </div>

    <!-- levels -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>Key Levels</div>
      <div class="levels-grid" id="levelsGrid"></div>
    </div>

    <!-- big trades -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>Big Trades (Zilvercat)</div>
      <div id="btContainer"><div class="null-text">No signals</div></div>
    </div>

    <!-- scoring -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>Scoring</div>
      <div class="score-grid" id="scoreGrid"></div>
    </div>

    <!-- risk -->
    <div class="card">
      <div class="card-title"><div class="ct-dot"></div>Risk &amp; Sizing</div>
      <div class="risk-strip" id="riskStrip"></div>
    </div>

  </div>
</div>

<script>
const P = n => n != null ? n : '—';
const fmt = n => n != null ? Number(n).toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:2}) : '—';
const fmtV = n => n != null ? Number(n).toFixed(1) : '—';

function sessClass(s) {
  if(!s) return 'sb-pre';
  s = s.toLowerCase();
  if(s.includes('open')||s.includes('morning')) return 'sb-open';
  if(s.includes('power')) return 'sb-ph';
  if(s.includes('dead')||s.includes('zone')) return 'sb-dz';
  return 'sb-pre';
}

function regimeClass(name) {
  if(!name) return '';
  const n = name.toUpperCase();
  if(n.includes('BULL_TREND')) return 'rc-bull';
  if(n.includes('BEAR_TREND')) return 'rc-bear';
  if(n.includes('OB')||n.includes('OVERBOUGHT')) return 'rc-ob';
  if(n.includes('OS')||n.includes('OVERSOLD')) return 'rc-os';
  if(n.includes('HIGH_VOL')||n.includes('EXPANSION')) return 'rc-vol';
  return 'rc-chop';
}

function confColor(c) {
  if(c>=8) return 'var(--bull)';
  if(c>=6) return 'var(--acc)';
  if(c>=4) return 'var(--warn)';
  return 'var(--bear)';
}

function rsiColor(v) {
  if(v==null) return 'var(--t2)';
  if(v>70) return 'var(--bear)';
  if(v<30) return '#a78bfa';
  if(v>55) return 'var(--bull)';
  if(v<45) return 'var(--bear)';
  return 'var(--t1)';
}

function render(d) {
  // header
  document.getElementById('hInst').textContent = P(d.instrument);
  document.getElementById('hContract').textContent = P(d.contract_month);
  const hSess = document.getElementById('hSess');
  hSess.textContent = P(d.session);
  hSess.className = 'sess-badge ' + sessClass(d.session);
  document.getElementById('hPrice').textContent = fmt(d.current_price);
  document.getElementById('hTime').textContent = (d.date||'')+(d.time_cst?' '+d.time_cst+' CST':'');

  // decision
  const dec = d.scoring?.decision || 'WAIT';
  const pill = document.getElementById('decPill');
  pill.textContent = dec;
  pill.className = 'dec-pill ' + (dec==='EXECUTE'?'d-execute':dec==='SKIP'?'d-skip':'d-wait');
  const overall = d.scoring?.overall;
  const scoreEl = document.getElementById('decScore');
  scoreEl.textContent = overall != null ? overall+'/10' : '—';
  scoreEl.style.color = confColor(overall||0);
  document.getElementById('decNarrative').textContent = d.narrative || '—';

  // risk flags
  const flags = document.getElementById('riskFlags');
  flags.innerHTML = '';
  const r4h = d.rsi?.find(r=>r.tf==='4H')?.flag;
  if(r4h==='NO_LONGS') flags.innerHTML += '<div class="rflag rf-stop">NO LONGS (RSI4H)</div>';
  else if(r4h==='NO_SHORTS') flags.innerHTML += '<div class="rflag rf-stop">NO SHORTS (RSI4H)</div>';
  else if(r4h==='REDUCE_SIZE') flags.innerHTML += '<div class="rflag rf-warn">REDUCE SIZE (RSI4H)</div>';
  if(d.risk?.size_adjustment==='Skip') flags.innerHTML += '<div class="rflag rf-stop">SKIP SESSION</div>';
  if(d.volatility?.atr_state==='Extreme') flags.innerHTML += '<div class="rflag rf-warn">HIGH VOL</div>';

  // regime
  const rc = document.getElementById('regimeCard');
  rc.className = 'regime-card ' + regimeClass(d.regime?.name);
  document.getElementById('regimeName').textContent = P(d.regime?.name);
  const conf = d.regime?.confidence;
  document.getElementById('confBar').style.width = conf!=null ? (conf*10)+'%' : '0';
  document.getElementById('confBar').style.background = confColor(conf||0);
  document.getElementById('confNum').textContent = conf!=null ? conf+'/10' : '—';
  document.getElementById('confNum').style.color = confColor(conf||0);
  document.getElementById('regimeReason').textContent = P(d.regime?.reasoning);

  // ema
  const emaTbody = document.getElementById('emaTbody');
  emaTbody.innerHTML = '';
  (d.ema_stack||[]).forEach(e=>{
    const biasClass = e.bias==='Bull'?'row-bull':e.bias==='Bear'?'row-bear':'';
    const tagClass = e.bias==='Bull'?'bt-bull':e.bias==='Bear'?'bt-bear':'bt-neutral';
    emaTbody.innerHTML += `<tr class="${biasClass}">
      <td style="color:var(--t3)">${e.tf}</td>
      <td>${fmt(e.ema9)}</td>
      <td>${fmt(e.ema21)}</td>
      <td><span class="bias-tag ${tagClass}">${P(e.bias)}</span></td>
    </tr>`;
  });

  // rsi
  const rsiRow = document.getElementById('rsiRow');
  rsiRow.innerHTML = '';
  (d.rsi||[]).forEach(r=>{
    const flagHtml = r.flag ? `<div class="rsi-flag-label">${r.flag}</div>` : '';
    rsiRow.innerHTML += `<div class="rsi-block">
      <div class="rsi-tf-label">${r.tf}</div>
      <div class="rsi-val" style="color:${rsiColor(r.value)}">${fmtV(r.value)}</div>
      <div class="rsi-zone-label">${P(r.zone)}</div>
      ${flagHtml}
    </div>`;
  });

  // vol
  const volRow = document.getElementById('volRow');
  const atr = d.volatility;
  const stateClass = atr?.atr_state ? 'vs-'+atr.atr_state.toLowerCase() : 'vs-normal';
  volRow.innerHTML = `
    <div class="vol-chip"><div class="vc-label">ATR 15m</div><div class="vc-val mono">${fmt(atr?.atr_15m)}</div></div>
    <div class="vol-chip"><div class="vc-label">State</div><div class="vc-val mono ${stateClass}">${P(atr?.atr_state)}</div></div>
    <div class="vol-chip"><div class="vc-label">Squeeze</div><div class="vc-val mono" style="color:${atr?.squeeze?'var(--warn)':'var(--bull)'}">${atr?.squeeze?'YES':'NO'}</div></div>`;

  // vwap
  const vwapCol = document.getElementById('vwapCol');
  const vw = d.vwap;
  const vwapColor = vw?.signal==='Bullish'?'var(--bull)':vw?.signal==='Bearish'?'var(--bear)':'var(--t2)';
  vwapCol.innerHTML = `
    <div class="card-title" style="margin-bottom:6px"><div class="ct-dot"></div>VWAP</div>
    <div class="vp-level"><span class="vp-label">Price</span><span class="vp-price mono">${fmt(vw?.price)}</span></div>
    <div class="vp-level"><span class="vp-label">Position</span><span class="vp-price mono" style="color:${vwapColor}">${P(vw?.price_vs_vwap)}</span></div>
    <div class="vp-level" style="border:none"><span class="vp-label">Signal</span><span class="vp-price" style="color:${vwapColor};font-weight:600">${P(vw?.signal)}</span></div>`;

  // vol profile
  const vpCol = document.getElementById('vpCol');
  const vp = d.volume_profile;
  const profColor = vp?.price_in_profile==='Above VAH'?'var(--bull)':vp?.price_in_profile==='Below VAL'?'var(--bear)':'var(--acc)';
  vpCol.innerHTML = `
    <div class="card-title" style="margin-bottom:6px"><div class="ct-dot"></div>Volume Profile</div>
    <div class="vp-level"><span class="vp-label">VAH</span><span class="vp-price mono" style="color:var(--bull)">${fmt(vp?.vah)}</span></div>
    <div class="vp-level"><span class="vp-label">POC</span><span class="vp-price mono" style="color:var(--acc)">${fmt(vp?.poc)}</span></div>
    <div class="vp-level"><span class="vp-label">VAL</span><span class="vp-price mono" style="color:var(--bear)">${fmt(vp?.val)}</span></div>
    <div class="vp-level" style="border:none"><span class="vp-label">Position</span><span style="font-size:10px;font-weight:600;color:${profColor}">${P(vp?.price_in_profile)}</span></div>`;

  // levels
  const lev = d.levels;
  const levGrid = document.getElementById('levelsGrid');
  if(lev) {
    const items = [
      ['PDH',lev.pdh,''],['PDL',lev.pdl,''],
      ['PDC',lev.pdc,''],['ONH',lev.onh,''],
      ['ONL',lev.onl,''],['Wk Hi',lev.weekly_high,''],
      ['Wk Lo',lev.weekly_low,''],['Rnd ↑',lev.round_above,''],
      ['Rnd ↓',lev.round_below,''],
      [lev.sasuke_above_label||'HTF ↑',lev.sasuke_above,'lev-sasuke'],
      [lev.sasuke_below_label||'HTF ↓',lev.sasuke_below,'lev-sasuke'],
    ];
    levGrid.innerHTML = items.filter(([,v])=>v!=null).map(([l,v,cls])=>
      `<div class="lev-row ${cls}"><span class="lev-label">${l}</span><span class="lev-val mono">${fmt(v)}</span></div>`
    ).join('');
  }

  // opportunities
  const opps = d.opportunities||[];
  const oppCont = document.getElementById('oppsContainer');
  if(!opps.length) {
    oppCont.innerHTML = `<div class="card"><div class="card-title"><div class="ct-dot"></div>Trade Opportunities</div><div class="null-text">No setups identified</div></div>`;
  } else {
    oppCont.innerHTML = `<div class="card"><div class="card-title"><div class="ct-dot"></div>Trade Opportunities</div>
      <div style="display:flex;flex-direction:column;gap:10px">
      ${opps.map(o=>{
        const isLong = o.direction==='LONG';
        const dirClass = isLong?'dp-long':'dp-short';
        const convClass = o.conviction==='HIGH'?'cb-high':o.conviction==='MEDIUM'?'cb-med':'cb-low';
        const conf = o.confluence||{};
        const confChecks = Object.entries(conf).map(([k,v])=>{
          const label = k.replace(/_/g,' ');
          return `<span class="cc-item ${v?'cc-pass':'cc-fail'}">${v?'✓':'○'} ${label}</span>`;
        }).join('');
        return `<div class="opp-card ${isLong?'long':'short'}">
          <div class="opp-hdr">
            <span class="dir-pill ${dirClass}">${P(o.direction)}</span>
            <span class="conv-badge ${convClass}">${P(o.conviction)}</span>
            <span style="flex:1"></span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3)">${o.id||''}</span>
          </div>
          <div class="opp-trigger">${P(o.entry_trigger)}</div>
          <div class="levels-strip">
            <div class="ls-item ls-entry"><div class="ls-label">Entry</div><div class="ls-val">${fmt(o.entry_price)}</div></div>
            <div class="ls-item ls-stop"><div class="ls-label">Stop</div><div class="ls-val">${fmt(o.stop)}</div></div>
            <div class="ls-item ls-t1"><div class="ls-label">T1</div><div class="ls-val">${fmt(o.t1)}</div></div>
            <div class="ls-item ls-t2"><div class="ls-label">T2</div><div class="ls-val">${fmt(o.t2)}</div></div>
            <div class="ls-item ls-rr"><div class="ls-label">R:R</div><div class="ls-val">${P(o.rr_t1)}</div></div>
          </div>
          <div class="conf-checks">${confChecks}</div>
          ${o.notes?`<div class="opp-notes">${o.notes}</div>`:''}
        </div>`;
      }).join('')}
      </div></div>`;
  }

  // scenarios
  const sc = d.scenarios;
  const scenGrid = document.getElementById('scenGrid');
  if(sc) {
    scenGrid.innerHTML = `
      <div class="scen scen-bull">
        <div class="scen-hdr"><span class="scen-name sn-bull">Bull</span><span class="scen-pct sp-bull mono">${P(sc.bull_probability)}%</span></div>
        <div class="scen-bar sb-bull" style="width:${sc.bull_probability||0}%"></div>
        <div class="scen-line"><span class="sl-key">Trigger</span><span class="sl-val">${P(sc.bull_trigger)}</span></div>
        <div class="scen-line" style="border:none"><span class="sl-key">Target</span><span class="sl-val">${P(sc.bull_target)}</span></div>
      </div>
      <div class="scen scen-bear">
        <div class="scen-hdr"><span class="scen-name sn-bear">Bear</span><span class="scen-pct sp-bear mono">${P(sc.bear_probability)}%</span></div>
        <div class="scen-bar sb-bear" style="width:${sc.bear_probability||0}%"></div>
        <div class="scen-line"><span class="sl-key">Trigger</span><span class="sl-val">${P(sc.bear_trigger)}</span></div>
        <div class="scen-line" style="border:none"><span class="sl-key">Target</span><span class="sl-val">${P(sc.bear_target)}</span></div>
      </div>
      <div class="scen scen-chop">
        <div class="scen-hdr"><span class="scen-name sn-chop">Chop</span><span class="scen-pct sp-chop mono">${P(sc.chop_probability)}%</span></div>
        <div class="scen-bar sb-chop" style="width:${sc.chop_probability||0}%"></div>
        <div class="scen-line" style="border:none"><span class="sl-key">Trigger</span><span class="sl-val">${P(sc.chop_trigger)}</span></div>
      </div>`;
    if(sc.invalidation) {
      document.getElementById('invBlock').innerHTML = `<div class="inv-block"><strong>Invalidation:</strong> ${sc.invalidation}</div>`;
    }
  }

  // big trades
  const btCont = document.getElementById('btContainer');
  const bts = d.bt_signals||[];
  if(!bts.length) {
    btCont.innerHTML = '<div class="null-text">No signals visible</div>';
  } else {
    btCont.innerHTML = bts.map(b=>{
      const isB = b.direction==='Buy';
      return `<div class="bt-item">
        <div class="btdot ${isB?'buy':'sell'}"></div>
        <div class="bt-price mono">${fmt(b.level)}</div>
        <div class="bt-note">${P(b.note)}</div>
        <div class="bt-size">${b.size?b.size+'ct':''}</div>
      </div>`;
    }).join('');
  }

  // scoring
  const sc2 = d.scoring;
  const scoreGrid = document.getElementById('scoreGrid');
  if(sc2) {
    const items = [
      ['Regime',sc2.regime],['Confluence',sc2.confluence],
      ['Risk/Reward',sc2.rr],['Timing',sc2.timing],['Macro',sc2.macro]
    ];
    scoreGrid.innerHTML = items.map(([l,v])=>`
      <div class="score-item">
        <div class="si-label">${l}</div>
        <div class="si-bar-bg"><div class="si-bar-fill" style="width:${v!=null?(v*10):'0'}%;background:${confColor(v||0)}"></div></div>
        <div class="si-val mono" style="color:${confColor(v||0)}">${v!=null?v+'/10':'—'}</div>
      </div>`).join('');
  }

  // risk strip
  const rk = d.risk;
  const riskStrip = document.getElementById('riskStrip');
  if(rk) {
    const sizeColor = rk.size_adjustment==='Full'?'rk-full':rk.size_adjustment==='Skip'?'rk-skip':'rk-half';
    riskStrip.innerHTML = `
      <div class="rk-chip"><div class="rk-label">Size</div><div class="rk-val mono ${sizeColor}">${P(rk.size_adjustment)}</div></div>
      <div class="rk-chip"><div class="rk-label">Session</div><div class="rk-val mono" style="font-size:11px">${P(rk.session_window)}</div></div>
      ${rk.rsi_4h_flag?`<div class="rk-chip"><div class="rk-label">4H RSI</div><div class="rk-val mono" style="color:var(--warn);font-size:11px">${rk.rsi_4h_flag}</div></div>`:''}`;
  }

  // chart
  const chartWrap = document.getElementById('chartWrap');
  const img = d.meta?.chart_image;
  if(img) {
    chartWrap.innerHTML = `<img src="${img}?t=${Date.now()}" alt="Live Chart" onerror="this.parentElement.innerHTML='<div class=chart-placeholder>Chart image not found</div>'">`;
  }

  document.getElementById('loader').classList.add('hidden');
}

async function loadData() {
  try {
    const res = await fetch('./data.json?t='+Date.now());
    const d = await res.json();
    render(d);
  } catch(e) {
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('decNarrative').textContent = 'Error loading data.json — run /analyze to generate.';
    console.error(e);
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
