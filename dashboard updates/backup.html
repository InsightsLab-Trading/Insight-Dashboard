<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insight Dashboard</title>
<script src="data.js"></script>
<style>
  :root {
    --bg: #080808; --surface: #0f0f0f; --surface2: #141414; --surface3: #1a1a1a;
    --border: #222222; --border2: #2a2a2a;
    --green: #4ade80; --green2: rgba(74,222,128,0.07); --green-border: rgba(74,222,128,0.18);
    --red: #f87171; --red2: rgba(248,113,113,0.07); --red-border: rgba(248,113,113,0.18);
    --yellow: #fbbf24; --yellow2: rgba(251,191,36,0.07); --yellow-border: rgba(251,191,36,0.18);
    --text: #e2e2e2; --muted: #484848; --dim: #7a7a7a; --dim2: #5e5e5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 28px 32px; min-height: 100vh; }

  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
  .header-left h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.8px; background: linear-gradient(135deg, #ffffff 0%, #666666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header-left .sub { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 0.3px; }
  .header-right { text-align: right; }
  .timestamp { font-size: 11px; color: var(--muted); line-height: 1.7; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border2); color: var(--dim); font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 500; margin-top: 7px; letter-spacing: 0.4px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .time-updated-bar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 16px; margin-bottom: 16px; }
  .tu-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .tu-val { font-size: 12px; font-weight: 600; color: var(--dim); }
  .tu-note { margin-left: auto; font-size: 10px; color: var(--muted); font-style: italic; }

  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-2-1 { grid-template-columns: 2fr 1fr; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 18px; }
  .card-sm { padding: 14px 15px; }
  .card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 13px; }

  .stat-value { font-size: 25px; font-weight: 700; letter-spacing: -1px; line-height: 1; color: #ffffff; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-change { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; margin-top: 6px; }
  .up { color: var(--green); } .down { color: var(--red); } .neutral { color: var(--yellow); }

  .signal { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .signal-bull { background: var(--green2); color: var(--green); border: 1px solid var(--green-border); }
  .signal-bear { background: var(--red2); color: var(--red); border: 1px solid var(--red-border); }
  .signal-warn { background: var(--yellow2); color: var(--yellow); border: 1px solid var(--yellow-border); }
  .signal-neut { background: rgba(80,80,80,0.08); color: var(--dim); border: 1px solid var(--border2); }

  .tf-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
  .tf-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 13px; }
  .tf-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 7px; }
  .tf-price { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: #ffffff; }
  .tf-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
  .tf-key { color: var(--muted); } .tf-val { font-weight: 500; }
  .rsi-bar-wrap { margin-top: 9px; }
  .rsi-track { height: 3px; background: var(--border2); border-radius: 2px; margin-top: 4px; }
  .rsi-fill { height: 100%; border-radius: 2px; }
  .rsi-label { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-top: 3px; }

  .idx-table { width: 100%; border-collapse: collapse; }
  .idx-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; padding: 5px 7px; text-align: left; border-bottom: 1px solid var(--border); }
  .idx-table td { padding: 6px 7px; font-size: 12px; border-bottom: 1px solid rgba(34,34,34,0.9); }
  .idx-table tr:last-child td { border-bottom: none; }
  .idx-table .name { color: var(--dim); font-weight: 500; } .idx-table .price { font-weight: 600; font-variant-numeric: tabular-nums; } .idx-table .chg { font-weight: 600; font-variant-numeric: tabular-nums; }

  .sector-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; border-bottom: 1px solid rgba(34,34,34,0.9); }
  .sector-row:last-child { border-bottom: none; }
  .sector-name { width: 135px; font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .bar-wrap { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .sector-val { width: 44px; text-align: right; font-size: 11px; font-weight: 600; }

  .level-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(34,34,34,0.9); font-size: 12px; }
  .level-row:last-child { border-bottom: none; }
  .level-label { color: var(--muted); font-size: 11px; } .level-val { font-weight: 700; font-variant-numeric: tabular-nums; }

  .bias-block { background: var(--surface2); border-radius: 8px; padding: 13px; margin-bottom: 9px; border: 1px solid var(--border); }
  .bias-title { font-size: 11px; color: var(--dim); margin-bottom: 5px; font-weight: 600; }
  .bias-text { font-size: 12px; line-height: 1.65; color: var(--dim2); }

  .heat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
  .heat-cell { border-radius: 6px; padding: 8px 5px; text-align: center; }
  .heat-cell .ticker { font-size: 11px; font-weight: 700; } .heat-cell .pct { font-size: 10px; margin-top: 2px; }

  .alert-bar { background: rgba(251,191,36,0.04); border: 1px solid rgba(251,191,36,0.16); border-radius: 9px; padding: 10px 15px; display: flex; align-items: flex-start; gap: 9px; font-size: 12px; color: var(--yellow); margin-bottom: 16px; line-height: 1.6; }
  .alert-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .bullets { list-style: none; }
  .bullets li { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; color: var(--dim2); border-bottom: 1px solid rgba(34,34,34,0.9); line-height: 1.55; }
  .bullets li:last-child { border-bottom: none; }
  .bullets li::before { content: "→"; color: var(--dim); flex-shrink: 0; }
  .corr-table { width: 100%; border-collapse: collapse; }
  .corr-table td { padding: 5px 7px; font-size: 11px; border-bottom: 1px solid rgba(34,34,34,0.7); }
  .corr-table tr:last-child td { border-bottom: none; }
  .corr-pair { color: var(--muted); } .corr-val { font-weight: 700; color: var(--dim); text-align: right; }
  .vol-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; border-bottom: 1px solid rgba(34,34,34,0.7); }
  .vol-row:last-child { border-bottom: none; }

  .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

  /* PLAYBOOKS */
  .playbook-card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 18px; display: flex; flex-direction: column; gap: 11px; }
  .playbook-header { display: flex; align-items: center; justify-content: space-between; }
  .playbook-name { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; }
  .playbook-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 3px 9px; border-radius: 4px; }
  .tag-long { background: var(--green2); color: var(--green); border: 1px solid var(--green-border); }
  .tag-short { background: var(--red2); color: var(--red); border: 1px solid var(--red-border); }
  .tag-neutral { background: rgba(80,80,80,0.08); color: var(--dim); border: 1px solid var(--border2); }
  .playbook-concept { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
  .playbook-desc { font-size: 12px; color: var(--dim2); line-height: 1.65; }
  .playbook-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; gap: 10px; }
  .playbook-row:last-child { border-bottom: none; }
  .pb-key { color: var(--muted); flex-shrink: 0; width: 110px; font-weight: 500; }
  .pb-val { color: var(--dim); line-height: 1.5; text-align: right; }

  /* NEWS */
  .news-score-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-bottom: 14px; }
  .news-score-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 13px; text-align: center; }
  .nsc-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 5px; }
  .nsc-val { font-size: 27px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .nsc-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .news-sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 5px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .news-body { font-size: 12px; color: var(--dim2); line-height: 1.65; }
  .news-bullets { list-style: none; }
  .news-bullets li { font-size: 12px; color: var(--dim2); padding: 4px 0; border-bottom: 1px solid rgba(34,34,34,0.7); line-height: 1.5; display: flex; gap: 7px; }
  .news-bullets li:last-child { border-bottom: none; }
  .news-bullets li::before { content: "·"; color: var(--muted); flex-shrink: 0; font-size: 16px; line-height: 1.2; }
  .news-sec { margin-bottom: 11px; }

  /* METER */
  .meter-wrap { display: flex; flex-direction: column; align-items: center; padding: 6px 0 2px; }
  .eye-container { position: relative; width: 210px; height: 105px; margin-bottom: 14px; }
  .meter-readout { text-align: center; margin-bottom: 10px; }
  .meter-score { font-size: 44px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .meter-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-top: 3px; }
  .meter-sublabel { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .meter-arc-wrap { width: 195px; margin: 0 auto 10px; }
  .meter-legend { display: flex; justify-content: space-between; width: 195px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }

  /* PLAN */
  .plan-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .plan-title { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px; }
  .plan-overview { font-size: 12px; color: var(--dim2); line-height: 1.7; margin-bottom: 15px; }
  .plan-sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; }
  .plan-if-row { display: flex; border-bottom: 1px solid var(--border); font-size: 11px; }
  .plan-if-row:last-child { border-bottom: none; }
  .plan-if-cond { padding: 6px 10px 6px 0; color: var(--muted); width: 130px; flex-shrink: 0; font-weight: 600; }
  .plan-if-action { padding: 6px 0; color: var(--dim2); line-height: 1.5; }
  .plan-step { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--dim2); line-height: 1.55; }
  .plan-step:last-child { border-bottom: none; }
  .plan-step-num { width: 18px; height: 18px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--dim); flex-shrink: 0; margin-top: 1px; }

  @media (max-width: 1100px) { .grid-4,.grid-3 { grid-template-columns: repeat(2,1fr); } .tf-grid { grid-template-columns: repeat(2,1fr); } .news-score-row { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 700px) { .grid-4,.grid-3,.grid-2,.grid-2-1 { grid-template-columns: 1fr; } .tf-grid { grid-template-columns: 1fr; } }
</style>

    es.appendChild(sve('circle',{cx:String(px),cy:'52',r:'25',fill:'url(#iG)',stroke:ec,'stroke-width':'1.1','stroke-opacity':'0.55'}));

      as.appendChild(sve('line',{x1:String(aCX),y1:String(aCY),x2:String(aCX+(aR-8)*Math.cos(fa)),y2:String(aCY-(aR-8)*Math.sin(fa)),stroke:ec,'stroke-width':'1.6','stroke-linecap':'round','stroke-opacity':'0.8'}));
